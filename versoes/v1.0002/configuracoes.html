<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerigma Admin | Sistema Teológico</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ═══ TOPBAR (modelo Jilo) ═══ -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><i class="fas fa-church"></i></div>
      <div class="brand-txt">
        <span class="brand-nome">Kerigma</span>
        <span class="brand-sub">Sistema Teológico</span>
      </div>
    </div>

    <!-- Abas de gestão (desktop) -->
    <nav class="tabs" id="tabsNav" aria-label="Módulos do sistema">
      <button class="tab-btn" data-tab="dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></button>
      <button class="tab-btn" data-tab="venda"><i class="fas fa-cash-register"></i><span>Venda</span></button>
      <button class="tab-btn" data-tab="produtos"><i class="fas fa-book"></i><span>Produtos</span></button>
      <button class="tab-btn" data-tab="relatorio"><i class="fas fa-chart-line"></i><span>Relatório</span></button>
      <button class="tab-btn" data-tab="configuracoes"><i class="fas fa-cog"></i><span>Config</span></button>
      <button class="tab-btn tab-hidden" data-tab="admin"><i class="fas fa-user-shield"></i><span>Admin</span></button>
    </nav>

    <div class="topbar-right">
      <a class="btn-store" href="../index.html" target="_blank" rel="noopener"><i class="fas fa-store"></i><span>Loja</span></a>
      <div class="conn-pill" id="sbStatusBar">
        <span class="dot"></span>
        <span id="sbStatusText">Offline</span>
      </div>
    </div>
  </div>

  <!-- ═══ CONTEÚDO ═══ -->
  <main class="main-content">
    <div class="content" id="content">
      <!-- Módulo ativo montado pelo router.js (por aba data-tab) -->
    </div>
  </main>

  <!-- ═══ BOTTOM-NAV (mobile) ═══ -->
  <nav class="bottom-nav" aria-label="Navegação móvel">
    <button class="bn-item" data-tab="dashboard"><i class="fas fa-th-large"></i><span>Início</span></button>
    <button class="bn-item" data-tab="venda"><i class="fas fa-cash-register"></i><span>Venda</span></button>
    <button class="bn-item" data-tab="produtos"><i class="fas fa-book"></i><span>Produtos</span></button>
    <button class="bn-item" data-tab="relatorio"><i class="fas fa-chart-line"></i><span>Relatório</span></button>
    <button class="bn-item" data-tab="configuracoes"><i class="fas fa-cog"></i><span>Config</span></button>
  </nav>

  <!-- ═══ LOGIN / CONFIRM MODAL ═══ -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirmar</h3>
      <p id="confirmMsg">Tem certeza?</p>
      <div class="actions">
        <button class="btn btn-outline" id="confirmCancel">Cancelar</button>
        <button class="btn btn-danger" id="confirmOk">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>

</body>
</html>
